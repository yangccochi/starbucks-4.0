<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meta Bucks Lab — Manager</title><link rel="stylesheet" href="/lab.css"><header>META BUCKS LAB · Manager</header><main><h1>Operations dashboard</h1><section><label for="key">Manager access key</label><input id="key" type="password" autocomplete="off"><button id="connect">Connect / Refresh</button><p id="msg" role="status"></p></section><section><h2>Orders</h2><div class="scroll"><table><thead><tr><th>Drink / food</th><th>Options</th><th>Total</th><th>Status</th><th>Action</th></tr></thead><tbody id="orders"></tbody></table></div></section><section><h2>Ingredient inventory</h2><p class="muted">Demo initial quantities · shared database · low stock threshold: 20% of initial quantity.</p><div class="scroll"><table><thead><tr><th>Ingredient</th><th>Remaining</th><th>Initial</th><th>Stock level</th><th>Status</th></tr></thead><tbody id="stock"></tbody></table></div></section></main><script>
const $=id=>document.getElementById(id);let key='',loading=false;function cell(row,value){const td=row.insertCell();td.textContent=value;return td}function label(s){return s.replaceAll('_',' ')}async function request(action,body){const r=await fetch('/api/lab/'+action,{method:body?'POST':'GET',headers:{'x-manager-key':key,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok)throw Error(d.error);return d}async function load(){if(!key||loading)return;loading=true;try{const d=await request('state');$('stock').replaceChildren();$('orders').replaceChildren();for(const s of d.stock){const row=$('stock').insertRow(),pct=Number(s.quantity)/Number(s.initial_quantity)*100;cell(row,label(s.id));cell(row,s.quantity+' '+s.unit);cell(row,s.initial_quantity+' '+s.unit);const td=cell(row,'');const bar=document.createElement('progress');bar.max=100;bar.value=pct;td.append(bar);cell(row,pct<=20?'LOW':'OK').className=pct<=20?'bad':'';}for(const o of d.orders){const row=$('orders').insertRow();cell(row,o.name);cell(row,[o.options.size,o.options.milk?label(o.options.milk):null,'Shots: '+o.options.shots,o.options.sweetness].filter(Boolean).join(' / '));cell(row,'₩'+o.total.toLocaleString());cell(row,o.status);const td=cell(row,'');if(o.status!=='completed'){const b=document.createElement('button');b.textContent=o.status==='queued'?'Start':'Complete';b.onclick=async()=>{b.disabled=true;try{await request('status',{id:o.id,status:o.status==='queued'?'preparing':'completed'});await load()}catch(e){$('msg').textContent=e.message;b.disabled=false}};td.append(b)}}$('msg').textContent='Updated '+new Date().toLocaleTimeString();}catch(e){$('msg').textContent=e.message;}finally{loading=false}}
$('connect').onclick=()=>{key=$('key').value;load()};setInterval(load,5000);
</script></html>
