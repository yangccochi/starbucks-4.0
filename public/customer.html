<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meta Bucks Lab — Customer</title><link rel="stylesheet" href="/lab.css"><header>META BUCKS LAB · Customer</header><main><h1>Make it yours.</h1><div class="layout"><section><h2>Choose your menu</h2><div id="menu">Loading…</div></section><section><h2 id="name">Choose a drink</h2><p class="muted">Select an item from the menu to customize it.</p><label>Size</label><select id="size"><option>Tall</option><option>Grande</option><option>Venti</option></select><label>Milk</label><select id="milk"></select><label>Extra espresso shots</label><select id="shots"><option value="0">0</option><option value="1">+1 / ₩500</option><option value="2">+2 / ₩1,000</option></select><label>Sweetness</label><select id="sweet"><option>Less</option><option selected>Normal</option><option>Extra</option></select><p class="muted" id="recipe"></p><h3>Total <span id="total">₩0</span></h3><button class="primary" id="submit" disabled>Place order (demo payment)</button><p id="message" role="status"></p><p class="muted">Demo payment only. Ingredients are deducted from shared inventory when the order is accepted.</p></section></div></main><script>
const $=id=>document.getElementById(id),money=n=>'₩'+n.toLocaleString('en-US'),label=k=>k.replaceAll('_',' ');let selected=null,busy=false;const sweetKeys=['classic_liquid_sugar','vanilla_syrup','hazelnut_syrup','caramel_syrup','peach_syrup','mocha_sauce'];
function refresh(){if(!selected)return;const food=selected.category==='Bakery';$('size').disabled=food;$('milk').disabled=selected.milks.length<2;$('shots').disabled=food||!('espresso_roast'in selected.recipe);$('sweet').disabled=food||!sweetKeys.some(k=>k in selected.recipe);$('total').textContent=money(selected.price+({Tall:0,Grande:500,Venti:1000}[$('size').value])+500*Number($('shots').value));$('submit').disabled=busy;}
function choose(m,btn){selected=m;document.querySelectorAll('.item').forEach(x=>x.classList.remove('active'));btn.classList.add('active');$('name').textContent=m.name;$('size').value='Tall';$('shots').value='0';$('sweet').value='Normal';$('milk').replaceChildren();for(const k of m.milks.length?m.milks:['']){$('milk').add(new Option(k?label(k):'Not applicable',k));}$('recipe').textContent='Ingredients: '+Object.keys(m.recipe).map(label).join(', ');$('message').textContent='';refresh();}
for(const id of ['size','milk','shots','sweet'])$(id).onchange=refresh;
(async()=>{try{const res=await fetch('/api/lab/menu');if(!res.ok)throw Error('Menu unavailable');const items=await res.json();$('menu').replaceChildren();for(const cat of ['Hot','Cold','Bakery']){const title=document.createElement('h3');title.textContent=cat;$('menu').append(title);const grid=document.createElement('div');grid.className='menu';for(const m of items.filter(x=>x.category===cat)){const btn=document.createElement('button');btn.className='item';btn.textContent=m.name+' · '+money(m.price);btn.onclick=()=>{if(!busy)choose(m,btn)};grid.append(btn)}$('menu').append(grid,document.createElement('br'));}}catch(e){$('menu').textContent=e.message}})();
$('submit').onclick=async()=>{if(busy||!selected)return;busy=true;refresh();$('message').textContent='Submitting…';try{const r=await fetch('/api/lab/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({menu:selected.id,size:$('size').value,milk:$('milk').value||null,shots:Number($('shots').value),sweetness:$('sweet').value})});const data=await r.json();if(!r.ok)throw Error(data.error);$('message').textContent='Order accepted: '+data.id+' · '+money(data.total);}catch(e){$('message').textContent=e.message;}finally{busy=false;refresh()}};
</script></html>
